[project]
name = "churn-service"
version = "0.2.3"
description = "ML Pro 1 sem"
requires-python=">=3.11, <3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn",
    "joblib",
    "psycopg[binary]",
    "mlflow-skinny==3.16.1",
    "skops>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E","F","I","B","UP"]


