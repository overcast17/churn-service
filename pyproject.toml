[project]
name = "churn-service"
version = "0.2.0"
description = "ML Pro 1 sem"
requires-python=">=3.11, <3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn",
    "joblib",
    "psycopg[binary]"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

